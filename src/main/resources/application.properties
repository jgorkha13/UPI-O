
# Database (override in production via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payment_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App
spring.application.name=payment-system
server.port=${PORT:8080}
# JWT (set JWT_SECRET in production; local dev uses a safe fallback)
jwt.secret=${JWT_SECRET:local-dev-secret-key-change-in-production-min-32-chars}
jwt.expiration=86400000

# CORS — comma-separated frontend URLs (set FRONTEND_URL in production)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000}

logging.level.org.springframework.security=INFO
